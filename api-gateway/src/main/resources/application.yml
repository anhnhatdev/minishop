server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:8080"
              - "http://127.0.0.1:5500"
              - "http://localhost:5500"
              - "https://minishop.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ==========================================
        # 1. USER SERVICE
        # ==========================================
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # ==========================================
        # 2. PRODUCT SERVICE
        # ==========================================
        - id: product-service-read
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/product-service

        - id: product-service-write
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**
            - Method=POST,PUT,DELETE
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/product-service

        # ==========================================
        # 3. ORDER SERVICE
        # ==========================================
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**, /api/v1/orders/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/order-service

        # ==========================================
        # 4. INVENTORY SERVICE
        # ==========================================
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: inventoryServiceCircuitBreaker
                fallbackUri: forward:/fallback/inventory-service

        # ==========================================
        # 5. PAYMENT SERVICE
        # ==========================================
        # Public: VNPay Sandbox Return & IPN Webhook
        - id: payment-service-public
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/vnpay/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment-service

        # Protected: Payment Status Polling & Admin Callback Logs
        - id: payment-service-protected
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment-service

        # ==========================================
        # 6. NOTIFICATION SERVICE
        # ==========================================
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service

        # ==========================================
        # 7. REVIEW SERVICE
        # ==========================================
        # Public: Get product reviews and rating summary
        - id: review-service-read
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/product/**
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: reviewServiceCircuitBreaker
                fallbackUri: forward:/fallback/review-service

        # Protected: Post review, reply, hide review
        - id: review-service-write
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: reviewServiceCircuitBreaker
                fallbackUri: forward:/fallback/review-service

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      productServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      orderServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      inventoryServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      paymentServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      notificationServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      reviewServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 5s
      productServiceCircuitBreaker:
        timeoutDuration: 5s
      orderServiceCircuitBreaker:
        timeoutDuration: 5s
      inventoryServiceCircuitBreaker:
        timeoutDuration: 5s
      paymentServiceCircuitBreaker:
        timeoutDuration: 5s
      notificationServiceCircuitBreaker:
        timeoutDuration: 5s
      reviewServiceCircuitBreaker:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
